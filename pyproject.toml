[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemeral-clipboard"
dynamic = ["version"]
description = "Send one secret over an encrypted, one-read relay."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "websockets>=14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
eclip = "eclip.cli:main"

[tool.setuptools.dynamic]
version = {attr = "eclip.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
